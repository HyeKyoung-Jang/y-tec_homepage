<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>와이텍 | 고객 · 파트너</title>

  <link rel="icon" type="image/png" href="./favicon.png">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f7f8f7;
      color: #222;
    }

    a { text-decoration: none; }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 22px 56px;
      display: flex;
      gap: 70px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(33,61,40,0.08);
    }

    .header-logo img { width: 170px; }

    .top-menu {
      display: flex;
      gap: 52px;
    }

    .top-menu a {
      color: #213D28;
      font-size: 18px;
    }

    .top-menu a.active { font-weight: 700; }

    .hero {
      min-height: 420px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.88), rgba(255,255,255,0.2)),
        url('client&partner.png') no-repeat right center / cover;
      display: flex;
      align-items: center;
    }

    .hero-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 90px 56px;
    }

    .hero h1 {
      font-size: 58px;
      color: #213D28;
    }

    .section {
      padding: 80px 56px;
    }

    .section-inner {
      max-width: 1320px;
      margin: 0 auto;
    }

    .info-box {
      background: linear-gradient(135deg, #213D28, #335e42);
      color: white;
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 40px;
    }

    .info-box h3 { margin: 0; }

    .partner-intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .partner-intro h2 {
      font-size: 36px;
      color: #213D28;
      line-height: 1.5;
    }

    /* 🔥 핵심 박스 */
    .partner-board {
      background: #edf4ef;
      border: 1px solid #dfe8e2;
      border-radius: 22px;
      padding: 34px;
    }

    .partner-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    /* 🔥 카드 */
    .partner-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e8e3;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    /* 🔥 hover 효과 */
    .partner-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      border-color: #213D28;
    }

    .partner-logo-area {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #edf1ee;
      background: #fff;
    }

    /* 🔥 로고 확대 */
    .partner-logo-area img {
      max-width: 140px;
      max-height: 70px;
      transition: transform 0.25s ease;
    }

    .partner-card:hover img {
      transform: scale(1.08);
    }

    .partner-placeholder {
      width: 140px;
      height: 60px;
      border: 1px dashed #bfd0c5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a867d;
      font-weight: 600;
    }

    .partner-name {
      text-align: center;
      padding: 14px;
      font-size: 15px;
      color: #485149;
    }

    /* 🔥 more 카드 */
    .more-card .partner-logo-area {
      background: linear-gradient(135deg, #213D28, #335e42);
      color: white;
      flex-direction: column;
    }

    .more-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 14px 30px rgba(33,61,40,0.25);
    }

    .more-dots {
      font-size: 40px;
      letter-spacing: 6px;
    }

    footer {
      text-align: center;
      padding: 26px;
      font-size: 13px;
      color: #9aa19c;
      border-top: 1px solid #e4e8e5;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="header-logo">
    <img src="logo.png">
  </a>

  <nav class="top-menu">
    <a href="company.html">회사소개</a>
    <a href="business.html">비즈니스</a>
    <a href="client-partner.html" class="active">고객 · 파트너</a>
    <a href="recruit.html">채용</a>
    <a href="location.html">회사위치</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Client · Partner</h1>
  </div>
</section>

<section class="section">
  <div class="section-inner">

    <div class="info-box">
      <h3>와이텍은 글로벌 벤더의 파트너로서 고객의 신뢰를 바탕으로 성장합니다.</h3>
    </div>

    <div class="partner-intro">
      <h2>
        고객 맞춤형 IT서비스를 제공하기 위하여<br>
        국내·외 벤더 및 우수한 파트너들과 함께 합니다.
      </h2>
    </div>

    <div class="partner-board">
      <div class="partner-grid">

        <!-- 반복 -->
        <div class="partner-card">
          <div class="partner-logo-area">
            <div class="partner-placeholder">LOGO</div>
          </div>
          <div class="partner-name">회사명</div>
        </div>

        <!-- 동일하게 10개 넣으면 됨 -->

        <!-- 🔥 more -->
        <div class="partner-card more-card">
          <div class="partner-logo-area">
            <div class="more-dots">...</div>
            <div>More</div>
          </div>
          <div class="partner-name">To be continued</div>
        </div>

      </div>
    </div>

  </div>
</section>

<footer>
  COPYRIGHT © 2026 Y-TEC ALL RIGHTS RESERVED.
</footer>

</body>
</html>
